# DPO restoration config — Llama-3.2-3B-Instruct on a single RTX 4090 (bf16).
model_id: meta-llama/Llama-3.2-3B-Instruct   # overridden with the jailbroken ckpt at runtime
output_dir: runs/dpo_restore

# DPO
beta: 0.1                 # KL leash / inverse temperature to the reference
lr: 5.0e-5               # lower than SFT; DPO is sensitive
epochs: 1                # 1-2 epochs; watch reward margins, not just loss
batch_size: 4
grad_accum: 4            # effective 16
max_length: 1024
max_prompt_length: 512

# LoRA (base = reference via adapter toggle; only ONE copy of base weights in memory)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj]
